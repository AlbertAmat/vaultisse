name: Docker release

# Fires on version tags, e.g. v1.2.3 (created by `npm version` — see
# "Releasing a new version" in the README). Runs the server test suite
# (calling test.yml directly, since that workflow skips tag pushes to avoid
# double-running against a commit already tested on its branch push) and,
# only if that passes, builds the production image, pushes it to GHCR, and
# cuts a matching GitHub Release.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive version and image name
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # A tag with a suffix (v1.3.7-beta.1) is a prerelease: it must not
          # take over :latest, and its GitHub Release is flagged as such.
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tags=${REGISTRY}/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            printf 'tags=%s\n' "${REGISTRY}/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v},${REGISTRY}/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          body: |
            Docker image: `${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}`

            ```
            docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ```
